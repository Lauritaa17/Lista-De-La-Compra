<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Compra Interactiva</title>
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-image:url(https://i.pinimg.com/736x/ab/c4/cb/abc4cbafc6de368aa740bb3f9c4436ac.jpg) ;"></body>
  
<h1>Lista de Compra</h1>
<div class="shopping-list">

    <div class="inputs">
        <input type="text" id="itemInput" placeholder="Producto">
        <input type="number" id="priceInput" placeholder="Precio" step="0.01">
        <button id="addButton">Añadir</button>
    </div>

    <ul id="shoppingList"></ul>

    <h2>Total: <span id="total">0.00</span> €</h2>

</div>

    <script src="script.js"></script>
</body>
</html>
